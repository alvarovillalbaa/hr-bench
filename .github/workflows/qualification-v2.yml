name: Temporary HRBench V2 final package and native qualification
on:
  push:
    branches: ['qa/hrbench-v2-20261115']
permissions:
  contents: read
jobs:
  final-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
      - name: Qualify final archive and full model-bearing explorer
        env:
          HRBENCH_MODE: final-native
          HRBENCH_REMAINING_SECONDS: '480'
          HRBENCH_OUTPUT: ${{ runner.temp }}/hrbench-v2-final-artifact
        run: python3 tests/scripts/qualify-v2.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: hrbench-v2-final-${{ github.run_id }}
          path: ${{ runner.temp }}/hrbench-v2-final-artifact
          if-no-files-found: error
          retention-days: 7
