# Retired recipe. No active workflow; new scope requires a fresh owned dispatch.
name: Temporary HRBench qualification
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        options: [pilot, browser]
      url:
        type: string
        required: false
      deployment_sha:
        type: string
        required: false
      cases:
        type: string
        required: false
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.x'
      - name: Owned qualification
        env:
          HRBENCH_MODE: ${{ inputs.mode }}
          HRBENCH_URL: ${{ inputs.url }}
          HRBENCH_DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
          HRBENCH_CASES: ${{ inputs.cases }}
          HRBENCH_OUTPUT: ${{ runner.temp }}/hrbench-artifact
        run: python3 tests/scripts/qualify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hrbench-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/hrbench-artifact
          if-no-files-found: error
          retention-days: 7
